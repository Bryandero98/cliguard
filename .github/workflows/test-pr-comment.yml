name: Test PR comment (temporary, verification only)

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./
        with:
          entry: ./demo-cli-for-testing.js
