name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The click adapter's own tests spawn a real python3/python with
      # click installed - explicit here rather than relying on whatever a
      # given runner image happens to already have (ubuntu-latest's did,
      # by luck of some other preinstalled tool depending on it; macOS's
      # didn't - caught live when this matrix first ran).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install click==8.3.2

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts"
      - run: npm test
