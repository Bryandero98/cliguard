name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx prettier --check "src/**/*.ts"
      - run: npm test

      # The tag is the single source of truth for what "this release" means -
      # verified against package.json rather than trusted blindly, so a tag
      # pushed against the wrong commit (or a version bump that never landed)
      # fails loudly here instead of publishing a mismatched package.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Pulls this version's own section out of CHANGELOG.md as the release
      # body, so the changelog stays the one place release notes are written.
      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # index()==1 (literal prefix match), not ~ (regex match) - the
          # heading itself contains [ and ], which ~ would parse as a
          # regex character class and never match. Verified live: v0.6.0's
          # own release notes came out empty from the ~ version before
          # this fix.
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
